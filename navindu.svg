<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&amp;display=swap');
    .name {
      font-family: 'Pacifico', cursive;
      font-size: 55px;
      fill: transparent;
      stroke: #0E75B6;
      stroke-width: 2.5;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: drawName 5s ease-in-out infinite;
    }
    @keyframes drawName {
      0% { stroke-dashoffset: 800; fill: transparent; }
      50% { stroke-dashoffset: 0; fill: transparent; }
      70% { stroke-dashoffset: 0; fill: #0E75B6; stroke: transparent; }
      100% { stroke-dashoffset: 0; fill: #0E75B6; stroke: transparent; }
    }
  </style>
  <text x="50%" y="60%" text-anchor="middle" dominant-baseline="middle" class="name">Navindu Vishvanath</text>
</svg>
